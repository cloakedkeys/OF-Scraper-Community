name: codecov
permissions: read-all
on:
  push:
    branches: main
    # Publish semver tags as releases.
    tags: [v*.*.*]
  pull_request:
    branches: main

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # oldest supported and current
        python-version: ["3.11", "3.15.1"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # version-pioneer derives the package version from git tags
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install ".[test]"
      - name: create required folder
        run: mkdir -p /home/runner/.config/ofscraper/main_profile
      - name: Run tests and collect coverage
        run: python -m pytest test --cov-report term --cov-report xml:coverage.xml --cov=ofscraper
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.python-version == '3.15.1' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
