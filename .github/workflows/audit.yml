name: audit
permissions:
  contents: read
on:
  push:
    branches: main
  pull_request:
    branches: main
  # new advisories land without any change on our side, so check weekly too
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.1
      # every package pinned in uv.lock, including all extras; the export is
      # fully pinned, so pip-audit doesn't need to resolve anything itself
      - name: Export locked requirements
        run: uv export --frozen --all-extras --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
      # PYSEC-2026-2447 (GHSA-w8v5-vhqr-4h9v, CVE-2025-69872): diskcache
      # unpickles cache entries and has no fixed release; mitigated by our
      # safe unpickler (#399). Remove this ignore once a fixed diskcache ships.
      - name: Run pip-audit
        run: >-
          uvx pip-audit@2.10.1
          -r "$RUNNER_TEMP/requirements.txt"
          --no-deps --disable-pip --strict --progress-spinner off
          --ignore-vuln PYSEC-2026-2447
